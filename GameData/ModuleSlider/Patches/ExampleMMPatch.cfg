//This is an example patch to add the slider module to a part and how to control value fields on that part with it.


@PART[PART-NAME-HERE-NOT-A-REAL-PART] //Standard MM language
{
	MODULE
	{
		name = ModuleSlider // The Module name for the Slider functionality added by this mod.
        sliderName = Your Name Here //The name of the slider displayed on the UI
        targetModule = ModuleName //The module inside which your target field can be found.
        targetField = FieldName //The name of your desired field, eg. mass
        minValue = FLOAT //Minimum value for the slider
        maxValue = FLOAT //Maximum value for the slider
        defaultValue = FLOAT //Default value for the slider
		sliderValue = FLOAT //Define SliderValue before anything tries to use it
        valueMultiplier = FLOAT //This is the value that the slider will be multiplied by before being applied to the desired field.  If you are modifying a field that accepts values of 0-1.0 but you want a slider that allows selecting values of 0-100 you would use a valueMultiplier of 0.01
		additionalTargets = ModuleName,FieldName,valueMultiplier FLOAT //Define any additional targets for this slider that should be changed based on its value, including a separate valueMultiplier so that they can be changed at different rates or even in different directions by using negative values for the multiplier.
    }
}